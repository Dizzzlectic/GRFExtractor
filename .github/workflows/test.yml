name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q tests validation/test_native_grf_oracle.py
      - name: Reproduce fixture bytes with reference zlib
        if: runner.os == 'Linux'
        run: python tests/fixtures/generate.py --check
      - run: node --test tests/test_native_decoder.cjs
      - run: grf-extract --help
      - run: grf --help
      - run: python -m build
